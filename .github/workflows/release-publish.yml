name: Release Publish

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.0.4)'
        required: true
  pull_request_target:
    types:
      - closed
    branches:
      - main

permissions:
  contents: read

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || (github.event.pull_request.merged == true && startsWith(github.event.pull_request.head.ref, 'changelog/') && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: npm-publish
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0

      - name: Verify tag matches package.json version
        if: github.event_name == 'workflow_dispatch'
        run: |
          TAG="${{ github.event.inputs.tag }}"
          VERSION=$(node -e "console.log(require('./package.json').version)")
          if [ "$TAG" != "v$VERSION" ]; then
            echo "Error: tag $TAG does not match package.json version v$VERSION"
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      # Re-running this workflow must not fail on an already-published version.
      - name: Check if version is already published
        id: published
        run: |
          VERSION=$(node -e "console.log(require('./package.json').version)")
          if npm view "@opencodeteam/cli@$VERSION" version >/dev/null 2>&1; then
            echo "Version $VERSION is already on npm — skipping publish"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify changelog section exists
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          if ! awk -v tag="$VERSION" '
            /^## \[/ { in_section = ($0 ~ "\\[v?" tag "\\]") }
            in_section { print }
          ' CHANGELOG.md | grep -q .; then
            echo "Error: No changelog section found for version $VERSION"
            exit 1
          fi

      - name: Run tests
        run: node --test bin/*.test.js

      - name: Run validation
        run: ruby scripts/validate.rb

      # npm provenance (package.json publishConfig.provenance) already covers
      # the registry-side attestation. This adds the GitHub-side attestation so
      # the release is verifiable with `gh attestation verify` and appears in
      # the repo's artifact list.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: package.json

      - name: Publish to npm
        if: steps.published.outputs.skip != 'true'
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Extract changelog for this version
        id: changelog
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          # Extract the changelog section for this version (format: ## [vX.Y.Z] or ## [X.Y.Z])
          awk -v tag="$VERSION" '
            /^## \[/ { in_section = ($0 ~ "\\[v?" tag "\\]") }
            in_section { print }
          ' CHANGELOG.md > /tmp/changelog.md
          # Check if we got content
          if [ ! -s /tmp/changelog.md ]; then
            echo "No changelog found for version $VERSION"
            echo "changelog=No changelog available" >> $GITHUB_OUTPUT
          else
            echo "changelog<<EOF" >> $GITHUB_OUTPUT
            cat /tmp/changelog.md >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          fi

      - name: Create GitHub Release
        if: steps.changelog.outputs.changelog != 'No changelog available'
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          TAG="v$VERSION"

          # Check if release already exists
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists, skipping creation"
          else
            echo "Creating GitHub Release for $TAG"
            gh release create "$TAG" \
              --verify-tag \
              --title "Release $TAG" \
              --notes-file /tmp/changelog.md
          fi
