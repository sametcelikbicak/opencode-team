name: welcome

on:
  issues:
    types: [opened]
  pull_request_target:
    types: [opened]

permissions:
  issues: write
  pull-requests: write

jobs:
  welcome:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/first-interaction@1c4688942c71f71d4f5502a26ea67c331730fa4d # v3.1.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          issue-message: "Thanks for your first issue. Please include your opencode version and the output of `./install.sh --check`."
          pr-message: "Thanks for your first pull request. Run `ruby scripts/validate.rb` and `./scripts/smoke-install.sh` before review."
