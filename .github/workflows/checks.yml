name: checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate manifests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate frontmatter and team.yaml
        shell: bash
        run: ruby scripts/validate.rb
      - name: Run checkpoint tests
        shell: bash
        run: python3 scripts/test-run-state.py

  cli-test:
    name: CLI test suite
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Install OpenCode 1.x
        run: npm install --global opencode-ai@1
      - name: Run CLI tests
        run: node --test bin/*.test.js

  reference:
    name: Generated reference
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - name: Install docs dependencies
        run: npm ci
      - name: Regenerate reference
        run: npm run generate:reference
      - name: Fail when generated reference is stale
        run: git diff --exit-code -- docs/reference

  shell:
    name: Shell syntax and lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: bash -n
        shell: bash
        run: bash -n install.sh scripts/*.sh skills/team-memory/*.sh
      - name: shellcheck
        shell: bash
        run: shellcheck --severity=error install.sh scripts/*.sh skills/team-memory/*.sh
      - name: memory compaction
        shell: bash
        run: ./scripts/test-memory-compact.sh
      - name: npm audit
        shell: bash
        run: |
          npm ci
          npm audit --audit-level=critical

  smoke:
    name: Install smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: install / check / uninstall
        shell: bash
        run: ./scripts/smoke-install.sh

  smoke-windows:
    name: Windows smoke (${{ matrix.shell }})
    runs-on: windows-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        shell: [powershell, pwsh]
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: install / check / uninstall
        run: ./scripts/smoke-install.ps1
      - name: Native memory compaction
        run: ./scripts/test-memory-compact.ps1
      - name: Run checkpoint tests
        run: python scripts/test-run-state.py

  pack-test:
    name: npm pack artifact test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - name: Pack the package
        run: npm pack
      - name: Extract to clean directory
        shell: bash
        run: |
          rm -rf pack-test
          mkdir -p pack-test
          tar -xzf opencodeteam-cli-*.tgz -C pack-test
      - name: Test install/check/uninstall from packed artifact
        shell: bash
        run: |
          cd pack-test/package
          TEST_CONFIG="$RUNNER_TEMP/pack-test-config"
          rm -rf "$TEST_CONFIG"
          mkdir -p "$TEST_CONFIG"
          node bin/opencode-team install --config-dir "$TEST_CONFIG"
          node bin/opencode-team check --config-dir "$TEST_CONFIG"
          node bin/opencode-team uninstall --config-dir "$TEST_CONFIG"
      - name: Test with path containing spaces
        shell: bash
        run: |
          cd pack-test/package
          TEST_CONFIG="$RUNNER_TEMP/pack test config"
          rm -rf "$TEST_CONFIG"
          mkdir -p "$TEST_CONFIG"
          node bin/opencode-team install --config-dir "$TEST_CONFIG"
          node bin/opencode-team check --config-dir "$TEST_CONFIG"
          node bin/opencode-team uninstall --config-dir "$TEST_CONFIG"
