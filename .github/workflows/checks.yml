name: checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate manifests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate frontmatter and team.yaml
        shell: bash
        run: ruby scripts/validate.rb
      - name: Run checkpoint tests
        shell: bash
        run: python3 scripts/test-run-state.py

  reference:
    name: Generated reference
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - name: Install docs dependencies
        run: npm ci
      - name: Regenerate reference
        run: npm run generate:reference
      - name: Fail when generated reference is stale
        run: git diff --exit-code -- docs/reference

  shell:
    name: Shell syntax and lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: bash -n
        shell: bash
        run: bash -n install.sh scripts/*.sh skills/team-memory/*.sh
      - name: shellcheck
        shell: bash
        run: shellcheck --severity=error install.sh scripts/*.sh skills/team-memory/*.sh
      - name: memory compaction
        shell: bash
        run: ./scripts/test-memory-compact.sh

  smoke:
    name: Install smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: install / check / uninstall
        shell: bash
        run: ./scripts/smoke-install.sh

  smoke-windows:
    name: Windows smoke (${{ matrix.shell }})
    runs-on: windows-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        shell: [powershell, pwsh]
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: install / check / uninstall
        run: ./scripts/smoke-install.ps1
      - name: Native memory compaction
        run: ./scripts/test-memory-compact.ps1
      - name: Run checkpoint tests
        run: python scripts/test-run-state.py
